<!DOCTYPE html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ตอบรับเข้าร่วมงาน | ปีใหม่ &amp; เจิด</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Prompt:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              petal: "#F0DADA",
              blush: "#E5C2C6",
              sage: "#C6D1B7",
              leaf: "#98A78E",
              ink: "#3E4740",
              moss: "#5C675A",
            },
            fontFamily: {
              serif: ['"Playfair Display"', "serif"],
              sans: ['"Prompt"', "sans-serif"],
            },
          },
        },
      };
    </script>
  </head>
  <body class="min-h-screen bg-petal font-sans text-ink">
    <p class="fixed right-3 top-3 z-10 text-[11px] tracking-wide text-moss/80">v7</p>
    <main class="mx-auto min-h-screen max-w-md pb-10">
      <section id="form-view">
        <header class="px-5 pb-2 pt-8 text-center">
          <div class="mx-auto flex h-12 w-12 items-center justify-center rounded-full bg-leaf/20 text-2xl text-leaf">♡</div>
          <h1 class="mt-4 font-serif text-2xl">ตอบรับเข้าร่วมงาน</h1>
          <p class="mt-1 text-xs text-moss">กรุณากรอกข้อมูลเพื่อยืนยันการเข้าร่วม</p>
          <p class="mt-1 font-serif text-sm text-leaf">ปีใหม่ &amp; เจิด</p>
        </header>

        <form id="rsvp-form" class="mx-4 mt-4 space-y-3">
          <div class="rounded-2xl bg-white px-4 py-4 shadow-sm">
            <label class="mb-2 block text-xs font-semibold text-moss" for="name">ชื่อของคุณ</label>
            <input
              id="name"
              name="name"
              required
              placeholder="ชื่อของคุณ"
              class="w-full border-b border-sage bg-transparent pb-1.5 text-base outline-none placeholder:text-sage focus:border-leaf"
            />
          </div>

          <div class="rounded-2xl bg-white px-4 py-4 shadow-sm">
            <label class="mb-2 block text-xs font-semibold text-moss" for="phone">เบอร์ติดต่อ</label>
            <input
              id="phone"
              name="phone"
              type="tel"
              inputmode="tel"
              required
              placeholder="08xxxxxxxx"
              class="w-full border-b border-sage bg-transparent pb-1.5 text-base outline-none placeholder:text-sage focus:border-leaf"
            />
          </div>

          <div class="rounded-2xl bg-white px-4 py-4 shadow-sm">
            <p class="mb-3 text-xs font-semibold text-moss">สะดวกมาร่วมงานไหม?</p>
            <div class="flex gap-2">
              <button type="button" data-attending="yes" class="attend-btn flex-1 rounded-xl border-2 border-sage py-2.5 text-sm font-semibold text-moss">สะดวก</button>
              <button type="button" data-attending="no" class="attend-btn flex-1 rounded-xl border-2 border-sage py-2.5 text-sm font-semibold text-moss">ไม่สะดวก</button>
            </div>
          </div>

          <div id="plan-card" class="hidden rounded-2xl bg-white px-4 py-4 shadow-sm">
            <p class="mb-3 text-xs font-semibold text-moss">มาวันไหน?</p>
            <div class="grid gap-2">
              <button type="button" data-plan="นครสวรรค์" class="plan-btn rounded-xl border-2 border-sage px-3 py-2.5 text-left text-sm font-semibold text-moss">
                นครสวรรค์ · อา. 27 ธ.ค. 2569
              </button>
              <button type="button" data-plan="กรุงเทพฯ" class="plan-btn rounded-xl border-2 border-sage px-3 py-2.5 text-left text-sm font-semibold text-moss">
                กรุงเทพฯ · ส. 23 ม.ค. 2570
              </button>
              <button type="button" data-plan="ทั้งสองวัน" class="plan-btn rounded-xl border-2 border-sage px-3 py-2.5 text-left text-sm font-semibold text-moss">
                ทั้งสองวัน
              </button>
            </div>
          </div>

          <div id="guests-card" class="hidden rounded-2xl bg-white px-4 py-4 shadow-sm">
            <label class="mb-2 block text-xs font-semibold text-moss" for="guests">จำนวนคนที่มา (รวมตัวเอง)</label>
            <input
              id="guests"
              name="guests"
              type="number"
              min="1"
              value="1"
              class="w-full border-b border-sage bg-transparent pb-1.5 text-base outline-none focus:border-leaf"
            />
          </div>

          <div class="rounded-2xl bg-white px-4 py-4 shadow-sm">
            <label class="mb-2 block text-xs font-semibold text-moss" for="message">ฝากข้อความถึงเรา (ไม่บังคับ)</label>
            <textarea
              id="message"
              name="message"
              rows="3"
              placeholder="ฝากคำอวยพร..."
              class="w-full resize-none rounded-xl bg-petal/70 px-3 py-2 text-base outline-none focus:ring-2 focus:ring-leaf/40"
            ></textarea>
          </div>

          <p id="error" class="hidden text-center text-xs text-blush"></p>
          <p id="need-hint" class="text-center text-xs text-moss"></p>

          <button id="submit-btn" type="submit" disabled class="w-full rounded-xl bg-leaf py-3.5 text-sm font-semibold text-white opacity-40">
            ยืนยัน
          </button>
        </form>
      </section>

      <section id="done-view" class="hidden px-6 pb-10 pt-16 text-center">
        <div class="mx-auto flex h-14 w-14 items-center justify-center rounded-full bg-leaf text-2xl text-white">✓</div>
        <h2 class="mt-5 font-serif text-2xl">ขอบคุณที่ตอบรับ</h2>
        <p id="done-note" class="mt-3 text-sm leading-relaxed text-moss"></p>
        <p class="mt-1 text-xs text-moss">แก้ได้ตรงนี้ก่อนปิดหน้า แล้วกดบันทึกการแก้ไข</p>
        <form id="edit-form" class="mx-auto mt-6 max-w-sm space-y-3 text-left">
          <div class="rounded-2xl bg-white px-4 py-4 shadow-sm">
            <label class="mb-2 block text-xs font-semibold text-moss" for="edit-name">ชื่อ</label>
            <input id="edit-name" class="w-full border-b border-sage bg-transparent pb-1.5 text-base outline-none focus:border-leaf" />
          </div>
          <div class="rounded-2xl bg-white px-4 py-4 shadow-sm">
            <label class="mb-2 block text-xs font-semibold text-moss" for="edit-phone">เบอร์</label>
            <input id="edit-phone" type="tel" inputmode="tel" class="w-full border-b border-sage bg-transparent pb-1.5 text-base outline-none focus:border-leaf" />
          </div>
          <div class="rounded-2xl bg-white px-4 py-4 shadow-sm">
            <p class="mb-3 text-xs font-semibold text-moss">สถานะ</p>
            <div class="flex gap-2">
              <button type="button" data-edit-attending="yes" class="edit-attend flex-1 rounded-xl border-2 border-sage py-2.5 text-sm font-semibold text-moss">สะดวก</button>
              <button type="button" data-edit-attending="no" class="edit-attend flex-1 rounded-xl border-2 border-sage py-2.5 text-sm font-semibold text-moss">ไม่สะดวก</button>
            </div>
          </div>
          <div id="edit-plan-card" class="rounded-2xl bg-white px-4 py-4 shadow-sm">
            <p class="mb-3 text-xs font-semibold text-moss">งาน</p>
            <div class="grid gap-2">
              <button type="button" data-edit-plan="นครสวรรค์" class="edit-plan rounded-xl border-2 border-sage px-3 py-2.5 text-left text-sm font-semibold text-moss">นครสวรรค์</button>
              <button type="button" data-edit-plan="กรุงเทพฯ" class="edit-plan rounded-xl border-2 border-sage px-3 py-2.5 text-left text-sm font-semibold text-moss">กรุงเทพฯ</button>
              <button type="button" data-edit-plan="ทั้งสองวัน" class="edit-plan rounded-xl border-2 border-sage px-3 py-2.5 text-left text-sm font-semibold text-moss">ทั้งสองวัน</button>
            </div>
          </div>
          <div id="edit-guests-card" class="rounded-2xl bg-white px-4 py-4 shadow-sm">
            <label class="mb-2 block text-xs font-semibold text-moss" for="edit-guests">จำนวนคน</label>
            <input id="edit-guests" type="number" min="1" class="w-full border-b border-sage bg-transparent pb-1.5 text-base outline-none focus:border-leaf" />
          </div>
          <div class="rounded-2xl bg-white px-4 py-4 shadow-sm">
            <label class="mb-2 block text-xs font-semibold text-moss" for="edit-message">ข้อความ</label>
            <textarea id="edit-message" rows="3" class="w-full resize-none rounded-xl bg-petal/70 px-3 py-2 text-base outline-none focus:ring-2 focus:ring-leaf/40"></textarea>
          </div>
          <p id="edit-error" class="hidden text-center text-xs text-blush"></p>
          <p id="edit-saved" class="hidden text-center text-xs text-moss">บันทึกแล้ว ปิดหน้านี้ได้เลย</p>
          <button id="save-edit" type="submit" class="w-full rounded-xl border-2 border-leaf bg-white py-3.5 text-sm font-semibold text-ink">
            บันทึกการแก้ไข
          </button>
        </form>
        <button id="close-page" type="button" class="mt-3 w-full rounded-xl bg-leaf py-3.5 text-sm font-semibold text-white">
          ปิดหน้านี้
        </button>
        <p id="close-hint" class="mt-4 hidden text-xs leading-relaxed text-moss">ถ้าหน้านี้ยังไม่ปิด ให้กดเครื่องหมาย X มุมบนของ LINE</p>
      </section>
    </main>

    <script>
      const RSVP_API = "https://peemai-jerd-wedding-line-bot.onrender.com/api/rsvp";
      const form = document.getElementById("rsvp-form");
      const submitBtn = document.getElementById("submit-btn");
      const errorEl = document.getElementById("error");
      const planCard = document.getElementById("plan-card");
      const guestsCard = document.getElementById("guests-card");
      let attending = "";
      let plan = "";
      let editToken = "";
      let editAttending = "";
      let editPlan = "";

      function selectedClass(on) {
        return on
          ? "bg-leaf text-white border-leaf shadow-sm"
          : "bg-white text-moss border-sage";
      }

      function renderChoices() {
        document.querySelectorAll(".attend-btn").forEach(function (btn) {
          btn.className =
            "attend-btn flex-1 rounded-xl border-2 py-2.5 text-sm font-semibold transition " +
            selectedClass(btn.getAttribute("data-attending") === attending);
        });
        document.querySelectorAll(".plan-btn").forEach(function (btn) {
          btn.className =
            "plan-btn rounded-xl border-2 px-3 py-2.5 text-left text-sm font-semibold transition " +
            selectedClass(btn.getAttribute("data-plan") === plan);
        });
        const coming = attending === "yes";
        planCard.classList.toggle("hidden", !coming);
        guestsCard.classList.toggle("hidden", !coming);
        const nameOk = Boolean(document.getElementById("name").value.trim());
        const phoneOk = document.getElementById("phone").value.replace(/\D/g, "").length >= 9;
        const ready = nameOk && phoneOk && attending && (!coming || plan);
        const missing = [];
        if (!nameOk) missing.push("ใส่ชื่อ");
        if (!phoneOk) missing.push("ใส่เบอร์อย่างน้อย 9 หลัก");
        if (!attending) missing.push("เลือกสะดวกหรือไม่สะดวก");
        else if (coming && !plan) missing.push("เลือกวันงาน");
        const hint = document.getElementById("need-hint");
        hint.textContent = missing.join(" · ");
        submitBtn.disabled = !ready;
        submitBtn.classList.toggle("opacity-40", !ready);
      }

      document.querySelectorAll(".attend-btn").forEach(function (btn) {
        btn.addEventListener("click", function () {
          attending = btn.getAttribute("data-attending");
          if (attending !== "yes") plan = "";
          renderChoices();
        });
      });

      document.querySelectorAll(".plan-btn").forEach(function (btn) {
        btn.addEventListener("click", function () {
          plan = btn.getAttribute("data-plan");
          renderChoices();
        });
      });

      document.getElementById("name").addEventListener("input", renderChoices);
      document.getElementById("phone").addEventListener("input", renderChoices);

      function renderEdit() {
        const coming = editAttending === "yes";
        document.querySelectorAll(".edit-attend").forEach(function (btn) {
          btn.className =
            "edit-attend flex-1 rounded-xl border-2 py-2.5 text-sm font-semibold transition " +
            selectedClass(btn.getAttribute("data-edit-attending") === editAttending);
        });
        document.querySelectorAll(".edit-plan").forEach(function (btn) {
          btn.className =
            "edit-plan rounded-xl border-2 px-3 py-2.5 text-left text-sm font-semibold transition " +
            selectedClass(btn.getAttribute("data-edit-plan") === editPlan);
        });
        document.getElementById("edit-plan-card").classList.toggle("hidden", !coming);
        document.getElementById("edit-guests-card").classList.toggle("hidden", !coming);
        document.getElementById("done-note").textContent = coming
          ? "ดีใจมากเลยที่มาได้ เจอกันในงานนะ"
          : "ขอบคุณที่บอกนะ เสียดายจังที่ไม่ได้เจอ";
      }

      function showDone(entry) {
        editToken = entry.token || "";
        editAttending = entry.coming ? "yes" : "no";
        editPlan = entry.coming ? entry.plan : "";
        document.getElementById("edit-name").value = entry.name;
        document.getElementById("edit-phone").value = entry.phone;
        document.getElementById("edit-guests").value = entry.guests || "1";
        document.getElementById("edit-message").value = entry.note || "";
        document.getElementById("edit-error").classList.add("hidden");
        document.getElementById("edit-saved").classList.add("hidden");
        renderEdit();
        document.getElementById("form-view").classList.add("hidden");
        document.getElementById("done-view").classList.remove("hidden");
      }

      document.querySelectorAll(".edit-attend").forEach(function (btn) {
        btn.addEventListener("click", function () {
          editAttending = btn.getAttribute("data-edit-attending");
          if (editAttending !== "yes") editPlan = "";
          document.getElementById("edit-saved").classList.add("hidden");
          renderEdit();
        });
      });

      document.querySelectorAll(".edit-plan").forEach(function (btn) {
        btn.addEventListener("click", function () {
          editPlan = btn.getAttribute("data-edit-plan");
          document.getElementById("edit-saved").classList.add("hidden");
          renderEdit();
        });
      });

      document.getElementById("edit-form").addEventListener("submit", async function (event) {
        event.preventDefault();
        const saveBtn = document.getElementById("save-edit");
        const editError = document.getElementById("edit-error");
        const name = document.getElementById("edit-name").value.trim();
        const phone = document.getElementById("edit-phone").value.trim();
        const coming = editAttending === "yes";
        if (!editToken) {
          editError.textContent = "รายการนี้แก้จากหน้านี้ไม่ได้แล้ว ปิดหน้าแล้วตอบรับใหม่ได้";
          editError.classList.remove("hidden");
          return;
        }
        if (!name || phone.replace(/\D/g, "").length < 9 || !editAttending || (coming && !editPlan)) {
          editError.textContent = "กรอกชื่อ เบอร์ และวันที่มาให้ครบก่อนบันทึกนะคะ";
          editError.classList.remove("hidden");
          return;
        }

        editError.classList.add("hidden");
        document.getElementById("edit-saved").classList.add("hidden");
        saveBtn.disabled = true;
        saveBtn.textContent = "กำลังบันทึก...";
        try {
          const response = await fetch(RSVP_API, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              token: editToken,
              name: name,
              phone: phone,
              attending: coming ? "สะดวก" : "ไม่สะดวก",
              plan: coming ? editPlan : "-",
              guests: coming ? document.getElementById("edit-guests").value.trim() || "1" : "0",
              note: document.getElementById("edit-message").value.trim() || "-",
            }),
          });
          const data = await response.json().catch(function () {
            return {};
          });
          if (!response.ok || data.ok === false) {
            throw new Error(data.error || "บันทึกไม่สำเร็จ");
          }
          document.getElementById("edit-saved").classList.remove("hidden");
        } catch (error) {
          editError.textContent = error && error.message ? error.message : "บันทึกไม่สำเร็จ ลองอีกครั้งนะคะ";
          editError.classList.remove("hidden");
        }
        saveBtn.disabled = false;
        saveBtn.textContent = "บันทึกการแก้ไข";
      });

      document.getElementById("close-page").addEventListener("click", function () {
        window.open("", "_self");
        window.close();
        document.getElementById("close-hint").classList.remove("hidden");
      });

      form.addEventListener("submit", async function (event) {
        event.preventDefault();
        const name = document.getElementById("name").value.trim();
        const phone = document.getElementById("phone").value.trim();
        if (!name || phone.replace(/\D/g, "").length < 9 || !attending || (attending === "yes" && !plan)) {
          errorEl.textContent = "กรอกชื่อ เบอร์ติดต่อ เลือกความสะดวก และวันงานให้ครบนะคะ";
          errorEl.classList.remove("hidden");
          return;
        }

        errorEl.classList.add("hidden");
        submitBtn.disabled = true;
        submitBtn.textContent = "กำลังบันทึก...";

        try {
          const response = await fetch(RSVP_API, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              name: name,
              phone: phone,
              attending: attending === "yes" ? "สะดวก" : "ไม่สะดวก",
              plan: attending === "yes" ? plan : "-",
              guests: attending === "yes" ? document.getElementById("guests").value.trim() || "1" : "0",
              note: document.getElementById("message").value.trim() || "-",
            }),
          });
          const data = await response.json().catch(function () {
            return {};
          });
          if (!response.ok || data.ok === false) {
            throw new Error(data.error || "บันทึกไม่สำเร็จ");
          }
          showDone({
            token: data.token || "",
            name: name,
            phone: phone,
            coming: attending === "yes",
            plan: plan,
            guests: document.getElementById("guests").value.trim() || "1",
            note: document.getElementById("message").value.trim(),
          });
        } catch (error) {
          errorEl.textContent = error && error.message ? error.message : "บันทึกไม่สำเร็จ ลองกดยืนยันอีกครั้งนะคะ";
          errorEl.classList.remove("hidden");
          submitBtn.textContent = "ยืนยัน";
          renderChoices();
        }
      });

      renderChoices();
    </script>
  </body>
</html>
